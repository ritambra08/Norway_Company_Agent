[project]
name = "norway-company-agent"
version = "0.1.0"
description = "Evidence-linked Norwegian company profiles from Brønnøysund open data"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.scripts]
norway-agent = "norway_agent.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["norway_agent"]
